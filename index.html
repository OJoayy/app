<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Règle de sécurité : l'app ne peut charger que son propre code.
       Aucun script, style, image ou connexion venant d'ailleurs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'self' https://api.frankfurter.dev; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#800020">
  <title>SIKA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<main id="app">

  <!-- Chargement -->
  <section id="s-loading" class="screen">
    <p class="center muted" data-i18n="loading"></p>
    <p id="fatal" class="error center" role="alert"></p>
  </section>

  <!-- Bienvenue (aucun coffre sur ce téléphone) -->
  <section id="s-welcome" class="screen" hidden>
    <img class="brand-icon" src="icons/icon-192.png" alt="">
    <div class="brand" data-i18n="appName"></div>
    <p class="center-text muted" data-i18n="welcomeIntro"></p>
    <div class="row">
      <button type="button" class="chip" data-lang="fr">Français</button>
      <button type="button" class="chip" data-lang="en">English</button>
    </div>
    <button type="button" id="btn-go-create" class="primary" data-i18n="createVault"></button>
    <button type="button" id="btn-go-restore" class="secondary" data-i18n="restoreBackup"></button>
  </section>

  <!-- Création du coffre -->
  <section id="s-create" class="screen" hidden>
    <h1 data-i18n="createTitle"></h1>
    <p data-i18n="createRules"></p>
    <ul class="tips">
      <li data-i18n="createTip1"></li>
      <li data-i18n="createTip2"></li>
    </ul>
    <label><span data-i18n="passLabel"></span>
      <input id="create-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label><span data-i18n="passConfirmLabel"></span>
      <input id="create-pass2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <p id="create-err" class="error" role="alert"></p>
    <button type="button" id="btn-create" class="primary" data-i18n="createBtn"></button>
    <button type="button" class="link" data-back="s-welcome" data-i18n="back"></button>
  </section>

  <!-- Clé de secours : affichée une seule fois -->
  <section id="s-reckey" class="screen" hidden>
    <h1 data-i18n="recTitle"></h1>
    <p data-i18n="recIntro"></p>
    <ul class="tips">
      <li data-i18n="recTip1"></li>
      <li data-i18n="recTip2"></li>
    </ul>
    <div id="reckey-groups" class="reckey" aria-live="polite"></div>
    <label class="check"><input type="checkbox" id="reckey-ack"> <span data-i18n="recAck"></span></label>
    <label><span data-i18n="recVerifyLabel"></span>
      <input id="reckey-verify" type="password" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    </label>
    <p id="reckey-err" class="error" role="alert"></p>
    <button type="button" id="btn-reckey-done" class="primary" data-i18n="recDone" disabled></button>
    <button type="button" id="btn-reckey-cancel" class="link" data-i18n="recCancel"></button>
  </section>

  <!-- Verrouillage -->
  <section id="s-lock" class="screen" hidden>
    <img class="brand-icon" src="icons/icon-192.png" alt="">
    <div class="brand" data-i18n="appName"></div>
    <div id="lock-pin-wrap" class="stack" hidden>
      <p class="center-text lead" id="lock-pin-title" data-i18n="pinAsk"></p>
      <div class="pin-box">
        <div class="pin-slots" data-for="lock-pin" aria-hidden="true"></div>
        <input id="lock-pin" class="pin-hidden" type="text" autocorrect="off" spellcheck="false" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" aria-labelledby="lock-pin-title">
      </div>
      <button type="button" id="btn-unlock-pin" class="primary" data-i18n="unlockBtn"></button>
      <button type="button" id="btn-use-pass" class="link" data-i18n="usePass"></button>
    </div>
    <div id="lock-pass-wrap" class="stack">
      <p id="lock-info" class="muted center-text"></p>
      <label><span data-i18n="passLabel"></span>
        <input id="lock-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <button type="button" id="btn-unlock" class="primary" data-i18n="unlockBtn"></button>
      <button type="button" id="btn-use-pin" class="link" data-i18n="usePin" hidden></button>
    </div>
    <p id="lock-msg" class="error center-text" role="alert"></p>
    <div class="row links">
      <button type="button" id="btn-go-recover" class="link" data-i18n="forgotPass"></button>
      <button type="button" id="btn-lock-restore" class="link" data-i18n="restoreBackup"></button>
    </div>
  </section>

  <!-- Phrase oubliée : clé de secours -->
  <section id="s-recover" class="screen" hidden>
    <h1 data-i18n="recoverTitle"></h1>
    <p data-i18n="recoverIntro"></p>
    <label><span data-i18n="recKeyLabel"></span>
      <input id="recover-key" type="password" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    </label>
    <label><span data-i18n="newPassLabel"></span>
      <input id="recover-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label><span data-i18n="passConfirmLabel"></span>
      <input id="recover-pass2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <p id="recover-err" class="error" role="alert"></p>
    <button type="button" id="btn-recover" class="primary" data-i18n="recoverBtn"></button>
    <button type="button" class="link" data-back="s-lock" data-i18n="back"></button>
  </section>

  <!-- Accueil (coffre ouvert) -->
  <section id="s-home" class="screen tabbed" hidden>
    <header class="brandbar">
      <button type="button" id="btn-settings" class="icon-btn left" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2"/><circle cx="9" cy="16.5" r="2"/></svg>
      </button>
      <div class="brand" data-i18n="appName"></div>
      <button type="button" id="btn-lock" class="icon-btn" data-i18n-aria="lockBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </header>
    <div id="home-msg" class="banner warn" role="status"></div>
    <div id="home-backup-warn" class="banner warn" role="status" hidden></div>
    <div class="card total">
      <button type="button" id="btn-discreet" class="eye-btn" data-i18n-aria="discreetToggle"></button>
      <p id="home-total" class="big money"></p>
      <p id="home-fx" class="fx money"></p>
      <p id="home-fx-stale" class="muted small-note" hidden></p>
    </div>
    <div id="home-late" class="banner danger" role="status" hidden></div>
    <div id="home-worth" class="card worth" hidden>
      <div class="worth-row"><span data-i18n="worthAssets"></span><span id="worth-assets" class="amt"></span></div>
      <div class="worth-row"><span data-i18n="worthDebts"></span><span id="worth-debts" class="amt"></span></div>
      <div class="worth-row total"><span data-i18n="worthNet"></span><span id="worth-net" class="amt"></span></div>
    </div>
    <div id="home-empty" class="card" hidden>
      <h2 data-i18n="emptyTitle"></h2>
      <p class="muted" data-i18n="emptyText"></p>
      <button type="button" id="btn-home-add-account" class="primary" data-i18n="addAccount"></button>
    </div>
    <div class="card">
      <h2 data-i18n="lastExpenses"></h2>
      <div id="home-expenses" class="list"></div>
    </div>
    <div class="card">
      <h2 data-i18n="lastIncomes"></h2>
      <div id="home-incomes" class="list"></div>
    </div>
    <p class="muted center-text" id="home-version"></p>
  </section>

  <!-- Comptes et pools -->
  <section id="s-accounts" class="screen tabbed" hidden>
    <h1 data-i18n="accountsTitle"></h1>
    <div class="card total">
      <p id="acc-total" class="big money"></p>
      <p id="acc-pools-note" class="muted"></p>
      <button type="button" id="btn-add-account" class="secondary" data-i18n="addAccount"></button>
    </div>
    <h2 data-i18n="poolsTitle"></h2>
    <div id="pool-grid" class="pool-grid"></div>
    <h2 data-i18n="accountsListTitle"></h2>
    <div id="acc-groups"></div>
  </section>

  <!-- Historique -->
  <section id="s-history" class="screen tabbed" hidden>
    <h1 data-i18n="historyTitle"></h1>
    <div class="row chips" id="hist-filters">
      <button type="button" class="chip" data-filter="all" data-i18n="filterAll"></button>
      <button type="button" class="chip" data-filter="expense" data-i18n="filterExpense"></button>
      <button type="button" class="chip" data-filter="income" data-i18n="filterIncome"></button>
      <button type="button" class="chip" data-filter="other" data-i18n="filterOther"></button>
    </div>
    <p id="hist-fees" class="banner info" hidden></p>
    <div id="hist-list" class="list card"></div>
    <button type="button" id="btn-hist-more" class="secondary" data-i18n="showMore" hidden></button>
  </section>

  <!-- Nouvelle opération / modifier -->
  <section id="s-tx" class="screen" hidden>
    <h1 id="tx-title"></h1>
    <!-- Montant et frais (%) sur la même ligne. -->
    <div class="amount-row">
      <label><span id="tx-amount-label" data-i18n="amountLabel"></span>
        <input id="tx-amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
      <label id="tx-fee-wrap" hidden><span data-i18n="feeLabel"></span>
        <input id="tx-fee" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
    </div>
    <p id="tx-fee-note" class="muted small-note" hidden></p>
    <label id="tx-debt-wrap" hidden><span data-i18n="debtLabel"></span>
      <select id="tx-debt"></select>
    </label>
    <label id="tx-asset-wrap" hidden><span data-i18n="assetLabel"></span>
      <select id="tx-asset"></select>
    </label>
    <label id="tx-share-wrap" hidden><span data-i18n="shareLabel"></span>
      <input id="tx-share" type="text" inputmode="decimal" autocomplete="off" value="100">
    </label>
    <label id="tx-desc-wrap"><span id="tx-desc-label"></span>
      <input id="tx-desc" type="text" maxlength="140" autocomplete="off">
    </label>
    <div id="tx-mood-wrap">
      <p class="field-label" id="tx-mood-title" data-i18n="moodLabel"></p>
      <div id="tx-moods" class="row chips wrap" role="group" aria-labelledby="tx-mood-title"></div>
    </div>
    <div id="tx-source-wrap">
      <p class="field-label" id="tx-source-title" data-i18n="sourceLabel"></p>
      <div id="tx-sources" class="row chips" role="group" aria-labelledby="tx-source-title"></div>
    </div>
    <label id="tx-from-wrap"><span id="tx-from-label"></span>
      <select id="tx-from"></select>
    </label>
    <label id="tx-to-wrap"><span id="tx-to-label"></span>
      <select id="tx-to"></select>
    </label>
    <label id="tx-pool-wrap"><span data-i18n="poolLabel"></span>
      <select id="tx-pool"></select>
    </label>
    <label><span data-i18n="dateLabel"></span>
      <input id="tx-date" type="date">
    </label>
    <div id="tx-split" class="card split" hidden></div>
    <div id="tx-nogo" class="banner danger" role="alert" hidden></div>
    <label id="tx-reason-wrap" hidden><span data-i18n="reasonLabel"></span>
      <textarea id="tx-reason" rows="2" maxlength="280" autocomplete="off"></textarea>
    </label>
    <div id="tx-acc-warn" class="banner warn" role="status" hidden></div>
    <p id="tx-err" class="error" role="alert"></p>
    <button type="button" id="btn-tx-save" class="primary" data-i18n="save"></button>
    <button type="button" id="btn-tx-delete" class="danger" data-i18n="deleteTx" hidden></button>
    <button type="button" id="btn-tx-cancel" class="link" data-i18n="cancel"></button>
  </section>

  <!-- Compte : créer / modifier -->
  <section id="s-account" class="screen" hidden>
    <h1 id="acc-form-title"></h1>
    <label><span data-i18n="accNameLabel"></span>
      <input id="acc-name" type="text" maxlength="40" autocomplete="off" placeholder="Wave, Orange Money, Espèces…">
    </label>
    <div class="acc-image-row">
      <span id="acc-avatar" class="avatar lg"></span>
      <button type="button" id="btn-acc-image" class="secondary small" data-i18n="accImagePick"></button>
      <button type="button" id="btn-acc-image-remove" class="link" data-i18n="accImageRemove" hidden></button>
      <input id="acc-image-file" type="file" accept="image/*" hidden>
    </div>
    <p class="field-label" id="acc-cat-title" data-i18n="accCategoryLabel"></p>
    <div id="acc-cats" class="row chips wrap" role="group" aria-labelledby="acc-cat-title"></div>
    <p id="acc-current" class="banner info" hidden></p>
    <label><span data-i18n="accStartLabel"></span>
      <input id="acc-start" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    </label>
    <p class="muted" data-i18n="accStartHelp"></p>
    <label class="check"><input type="checkbox" id="acc-split"> <span data-i18n="accSplitLabel"></span></label>

    <label class="check" id="acc-archived-wrap"><input type="checkbox" id="acc-archived"> <span data-i18n="accArchivedLabel"></span></label>
    <p id="acc-err" class="error" role="alert"></p>
    <button type="button" id="btn-acc-save" class="primary" data-i18n="save"></button>
    <button type="button" id="btn-acc-cancel" class="link" data-i18n="cancel"></button>
  </section>

  <!-- Dettes -->
  <section id="s-debts" class="screen tabbed" hidden>
    <h1 data-i18n="debtsTitle"></h1>
    <div class="card total">
      <button type="button" id="btn-debts-discreet" class="eye-btn" data-i18n-aria="discreetToggle"></button>
      <p class="muted" data-i18n="debtBalanceTitle"></p>
      <p id="debts-total" class="big"></p>
      <p id="debts-topay" class="muted"></p>
      <p id="debts-next" class="muted"></p>
      <button type="button" id="btn-add-debt" class="secondary" data-i18n="addDebt"></button>
    </div>
    <div id="debts-late" class="banner danger" role="status" hidden></div>
    <div id="debts-list" class="card list"></div>
    <div id="debts-done-wrap" class="card list archived" hidden>
      <h2 data-i18n="debtsDone"></h2>
      <div id="debts-done"></div>
    </div>
    <div id="strategy" class="card" hidden>
      <h2 data-i18n="strategyTitle"></h2>
      <div id="strategy-methods" class="row chips" role="group"></div>
      <p class="muted small-note" data-i18n="strategyHelp"></p>
      <label><span data-i18n="strategyExtra"></span>
        <input id="strategy-extra" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
      <div id="strategy-result" class="split-grid"></div>
      <p id="strategy-priority" class="muted"></p>
      <div id="strategy-suggest" class="banner info" hidden></div>
      <button type="button" id="btn-strategy-pay" class="secondary" hidden></button>
    </div>
  </section>

  <!-- Une dette -->
  <section id="s-debt" class="screen" hidden>
    <h1 id="debt-title"></h1>
    <div id="debt-late" class="banner danger" role="status" hidden></div>
    <div class="card">
      <div id="debt-stats" class="split-grid"></div>
      <p id="debt-next" class="muted"></p>
    </div>
    <div class="row">
      <button type="button" id="btn-debt-repay" class="primary" data-i18n="repayBtn"></button>
      <button type="button" id="btn-debt-ics" class="secondary" data-i18n="debtIcs"></button>
    </div>
    <div class="card">
      <h2 data-i18n="scheduleTitle"></h2>
      <div id="debt-schedule" class="list"></div>
      <button type="button" id="btn-debt-more" class="link" data-i18n="showMore" hidden></button>
    </div>
    <div class="card">
      <h2 data-i18n="repaymentsTitle"></h2>
      <div id="debt-repays" class="list"></div>
    </div>
    <button type="button" id="btn-debt-edit" class="secondary" data-i18n="editDebt"></button>
    <button type="button" id="btn-debt-back" class="link" data-i18n="back"></button>
  </section>

  <!-- Dette : créer / modifier -->
  <section id="s-debt-form" class="screen" hidden>
    <h1 id="debt-form-title"></h1>
    <label><span data-i18n="lenderLabel"></span>
      <input id="debt-lender" type="text" maxlength="40" autocomplete="off">
    </label>
    <div id="debt-origin-wrap">
      <p class="field-label" id="debt-origin-title" data-i18n="debtOriginLabel"></p>
      <div id="debt-origins" class="row chips wrap" role="group" aria-labelledby="debt-origin-title"></div>
    </div>
    <label id="debt-account-wrap"><span data-i18n="debtAccountLabel"></span>
      <select id="debt-account"></select>
    </label>
    <label><span id="debt-principal-label"></span>
      <input id="debt-principal" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    </label>
    <div class="row">
      <label><span data-i18n="rateLabel"></span>
        <input id="debt-rate" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
      <label><span data-i18n="monthsLabel"></span>
        <input id="debt-months" type="text" inputmode="numeric" autocomplete="off" placeholder="12">
      </label>
    </div>
    <label><span id="debt-start-label"></span>
      <input id="debt-start" type="date">
    </label>
    <p class="field-label" id="debt-mode-title" data-i18n="scheduleModeLabel"></p>
    <div id="debt-modes" class="row chips wrap" role="group" aria-labelledby="debt-mode-title"></div>
    <div id="debt-rows-wrap" class="stack" hidden>
      <p class="muted" data-i18n="manualHelp"></p>
      <div id="debt-rows" class="stack"></div>
      <div class="row">
        <button type="button" id="btn-debt-fill" class="secondary small" data-i18n="fillFromCalc"></button>
        <button type="button" id="btn-debt-addrow" class="secondary small" data-i18n="addRow"></button>
      </div>
    </div>
    <div id="debt-preview" class="banner info"></div>
    <p id="debt-err" class="error" role="alert"></p>
    <button type="button" id="btn-debt-save" class="primary" data-i18n="save"></button>
    <button type="button" id="btn-debt-delete" class="danger" data-i18n="deleteDebt" hidden></button>
    <button type="button" id="btn-debt-cancel" class="link" data-i18n="cancel"></button>
  </section>

  <!-- Investir -->
  <section id="s-assets" class="screen tabbed" hidden>
    <h1 data-i18n="assetsTitle"></h1>
    <div class="card total">
      <p class="muted" data-i18n="assetsValueTitle"></p>
      <p id="assets-total" class="big"></p>
      <p id="assets-gain" class="muted"></p>
      <button type="button" id="btn-add-asset" class="secondary" data-i18n="addAsset"></button>
    </div>
    <div id="assets-groups" class="stack"></div>
  </section>

  <!-- Un actif -->
  <section id="s-asset" class="screen" hidden>
    <h1 id="asset-title"></h1>
    <div class="card total">
      <p id="asset-tags" class="muted"></p>
      <p id="asset-value" class="big"></p>
      <p id="asset-gain" class="muted"></p>
      <div id="asset-spark"></div>
    </div>
    <div class="card">
      <div id="asset-stats" class="split-grid"></div>
    </div>
    <div class="card">
      <h2 data-i18n="updateValueTitle"></h2>
      <label><span data-i18n="newValueLabel"></span>
        <input id="asset-new-value" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
      <div id="asset-currencies" class="row chips" role="group"></div>
      <p id="asset-value-msg" class="error" role="alert"></p>
      <button type="button" id="btn-asset-value" class="secondary" data-i18n="save"></button>
    </div>
    <div class="row">
      <button type="button" id="btn-asset-buy" class="primary" data-i18n="buyMore"></button>
      <button type="button" id="btn-asset-sell" class="secondary" data-i18n="sellBtn"></button>
    </div>
    <button type="button" id="btn-asset-income" class="secondary" data-i18n="assetIncomeBtn"></button>
    <div class="card">
      <h2 data-i18n="assetHistoryTitle"></h2>
      <div id="asset-events" class="list"></div>
    </div>
    <button type="button" id="btn-asset-edit" class="secondary" data-i18n="editAsset"></button>
    <button type="button" id="btn-asset-back" class="link" data-i18n="back"></button>
  </section>

  <!-- Actif : créer / modifier -->
  <section id="s-asset-form" class="screen" hidden>
    <h1 id="asset-form-title"></h1>
    <label><span data-i18n="assetNameLabel"></span>
      <input id="asset-name" type="text" maxlength="40" autocomplete="off">
    </label>
    <p class="field-label" id="asset-cat-title" data-i18n="accCategoryLabel"></p>
    <div id="asset-cats" class="row chips wrap" role="group" aria-labelledby="asset-cat-title"></div>
    <div id="asset-origin-wrap">
      <p class="field-label" id="asset-origin-title" data-i18n="assetOriginLabel"></p>
      <div id="asset-origins" class="row chips wrap" role="group" aria-labelledby="asset-origin-title"></div>
    </div>
    <div id="asset-buy-wrap" class="stack">
      <label><span data-i18n="account"></span>
        <select id="asset-account"></select>
      </label>
      <label><span data-i18n="buyAmountLabel"></span>
        <input id="asset-buy-amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
    </div>
    <div id="asset-own-wrap" class="stack" hidden>
      <label><span data-i18n="assetCostLabel"></span>
        <input id="asset-cost" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
      <label><span data-i18n="assetValueNowLabel"></span>
        <input id="asset-value-now" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
    </div>
    <label class="check" id="asset-closed-wrap" hidden><input type="checkbox" id="asset-closed"> <span data-i18n="assetClosedLabel"></span></label>
    <p id="asset-err" class="error" role="alert"></p>
    <button type="button" id="btn-asset-save" class="primary" data-i18n="save"></button>
    <button type="button" id="btn-asset-delete" class="danger" data-i18n="deleteAsset" hidden></button>
    <button type="button" id="btn-asset-cancel" class="link" data-i18n="cancel"></button>
  </section>

  <!-- Mes envies (écran caché : appui long sur SIKA, ou Réglages) -->
  <section id="s-wishes" class="screen" hidden>
    <h1 data-i18n="wishesTitle"></h1>
    <div class="card total">
      <p class="muted" data-i18n="wishesTotalTitle"></p>
      <p id="wishes-total" class="big"></p>
      <p id="wishes-count" class="muted"></p>
      <button type="button" id="btn-add-wish" class="secondary" data-i18n="addWish"></button>
    </div>
    <div id="wishes-list" class="card list"></div>
    <div id="wishes-done-wrap" class="card list archived" hidden>
      <button type="button" id="btn-wishes-done" class="link"></button>
      <div id="wishes-done" hidden></div>
    </div>
    <button type="button" id="btn-wishes-back" class="link" data-i18n="back"></button>
  </section>

  <!-- Une envie : ajouter / modifier -->
  <section id="s-wish-form" class="screen" hidden>
    <h1 id="wish-form-title"></h1>
    <label><span data-i18n="wishNameLabel"></span>
      <input id="wish-name" type="text" maxlength="40" autocomplete="off">
    </label>
    <label><span data-i18n="wishNoteLabel"></span>
      <textarea id="wish-note" rows="3" maxlength="280"></textarea>
    </label>
    <label><span data-i18n="wishAmountLabel"></span>
      <input id="wish-amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    </label>
    <div id="wish-currencies" class="row chips" role="group" data-i18n-aria="currencyLabel"></div>
    <p id="wish-err" class="error" role="alert"></p>
    <button type="button" id="btn-wish-save" class="primary" data-i18n="save"></button>
    <button type="button" id="btn-wish-delete" class="danger" data-i18n="deleteWish" hidden></button>
    <button type="button" id="btn-wish-cancel" class="link" data-i18n="cancel"></button>
  </section>

  <!-- Réglages -->
  <section id="s-settings" class="screen tabbed" hidden>
    <h1 data-i18n="settings"></h1>


    <div class="card">
      <h2 data-i18n="backupTitle"></h2>
      <p id="set-last-backup" class="muted"></p>
      <p class="muted" data-i18n="backupHelp"></p>
      <button type="button" id="btn-export-dl" class="primary" data-i18n="exportDownload"></button>
      <button type="button" id="btn-export-share" class="secondary" data-i18n="exportShare" hidden></button>
      <button type="button" id="btn-go-import" class="secondary" data-i18n="importBtn"></button>
      <p id="export-msg" class="ok" role="status"></p>
      <p id="export-help" class="muted small-note" data-i18n="driveHelp"></p>
    </div>

    <div class="card">
      <h2 data-i18n="pinTitle"></h2>
      <p id="pin-status" class="muted"></p>
      <p id="pin-msg" class="error" role="alert"></p>
      <div id="pin-actions" class="row">
        <button type="button" id="btn-pin-open" class="secondary"></button>
        <button type="button" id="btn-pin-remove" class="secondary" data-i18n="pinRemove" hidden></button>
      </div>
      <div id="pin-form" class="stack" hidden>
        <label><span data-i18n="currentPassLabel"></span>
          <input id="pin-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        </label>
        <p class="field-label" id="pin-new-title" data-i18n="pinNew"></p>
        <div class="pin-box">
          <div class="pin-slots" data-for="pin-new" aria-hidden="true"></div>
          <input id="pin-new" class="pin-hidden" type="text" autocorrect="off" spellcheck="false" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" aria-labelledby="pin-new-title">
        </div>
        <p class="field-label" id="pin-new2-title" data-i18n="pinConfirm"></p>
        <div class="pin-box">
          <div class="pin-slots" data-for="pin-new2" aria-hidden="true"></div>
          <input id="pin-new2" class="pin-hidden" type="text" autocorrect="off" spellcheck="false" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" aria-labelledby="pin-new2-title">
        </div>
        <button type="button" id="btn-pin-show" class="link" data-i18n="pinShow"></button>
        <button type="button" id="btn-pin-save" class="primary" data-i18n="pinSave"></button>
        <button type="button" id="btn-pin-cancel" class="link" data-i18n="cancel"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="passTitle"></h2>
      <p id="cp-msg" class="error" role="alert"></p>
      <button type="button" id="btn-cp-open" class="secondary" data-i18n="changePassTitle"></button>
      <div id="cp-form" class="stack" hidden>
        <label><span data-i18n="currentPassLabel"></span>
          <input id="cp-old" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        </label>
        <label><span data-i18n="newPassLabel"></span>
          <input id="cp-new" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        </label>
        <label><span data-i18n="passConfirmLabel"></span>
          <input id="cp-new2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        </label>
        <p class="muted" data-i18n="changePassHelp"></p>
        <button type="button" id="btn-change-pass" class="primary" data-i18n="changePassBtn"></button>
          <button type="button" id="btn-cp-cancel" class="link" data-i18n="cancel"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="langTitle"></h2>
      <div class="row">
        <button type="button" class="chip" data-lang="fr">Français</button>
        <button type="button" class="chip" data-lang="en">English</button>
      </div>
      <h2 id="lock-delay-title" data-i18n="lockDelayTitle"></h2>
      <select id="lock-delay" aria-labelledby="lock-delay-title">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5">5 min</option>
      </select>
      <label class="check"><input type="checkbox" id="fx-online"> <span data-i18n="fxOnlineLabel"></span></label>
      <p class="muted" data-i18n="fxOnlineHelp"></p>
    </div>

    <div class="card">
      <h2 data-i18n="calTitle"></h2>
      <p class="muted" data-i18n="calHelp"></p>
      <button type="button" id="btn-ics" class="secondary" data-i18n="calIcs"></button>
      <a id="link-gcal" class="button secondary" target="_blank" rel="noopener noreferrer" data-i18n="calLink"></a>
    </div>

    <div class="card">
      <h2 data-i18n="storageTitle"></h2>
      <p id="storage-status" class="muted"></p>
    </div>

    <div class="card danger-zone">
      <h2 data-i18n="wipeTitle"></h2>
      <p class="muted" data-i18n="wipeHelp"></p>
      <button type="button" id="btn-wipe" class="danger" data-i18n="wipeBtn"></button>
    </div>
    <button type="button" id="btn-open-wishes" class="link" data-i18n="wishesTitle"></button>
  </section>

  <!-- Importer une sauvegarde -->
  <section id="s-import" class="screen" hidden>
    <h1 data-i18n="importTitle"></h1>
    <p data-i18n="importIntro"></p>
    <label><span data-i18n="importFileLabel"></span>
      <input id="import-file" type="file">
    </label>
    <fieldset class="row">
      <label class="check"><input type="radio" name="import-mode" value="pass" checked> <span data-i18n="importModePass"></span></label>
      <label class="check"><input type="radio" name="import-mode" value="rec"> <span data-i18n="importModeRec"></span></label>
    </fieldset>
    <label><span id="import-secret-label" data-i18n="passLabel"></span>
      <input id="import-secret" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <div id="import-newpass" hidden>
      <p class="muted" data-i18n="importNewPassHelp"></p>
      <label><span data-i18n="newPassLabel"></span>
        <input id="import-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label><span data-i18n="passConfirmLabel"></span>
        <input id="import-pass2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
    </div>
    <p id="import-msg" class="error" role="alert"></p>
    <button type="button" id="btn-import" class="primary" data-i18n="importCheckBtn"></button>
    <button type="button" id="btn-import-back" class="link" data-i18n="back"></button>
  </section>

  <!-- Fenêtre de confirmation -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <input id="modal-input" type="text" autocomplete="off" autocapitalize="characters" hidden>
      <div class="row">
        <button type="button" id="modal-cancel" class="secondary" data-i18n="cancel"></button>
        <button type="button" id="modal-ok" class="danger" data-i18n="confirm"></button>
      </div>
    </div>
  </div>

  <div id="busy" class="busy" hidden><p data-i18n="working"></p></div>

  <!-- Bouton + flottant et son menu -->
  <div id="fab-backdrop" class="fab-backdrop" hidden></div>
  <div id="fab-menu" class="fab-menu" hidden>
    <!-- Transfert au-dessus de Revenu ; en bas, Dépense et Revenu se partagent la ligne. -->
    <button type="button" id="fab-transfer" class="fab-transfer" data-i18n="newTransfer"></button>
    <button type="button" id="fab-expense" class="fab-expense" data-i18n="newExpense"></button>
    <button type="button" id="fab-income" class="fab-income" data-i18n="newIncome"></button>
  </div>
  <button type="button" id="fab" class="fab" data-i18n-aria="addTx" aria-expanded="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Barre d'onglets (coffre ouvert seulement) -->
  <nav id="tabbar" class="tabbar" hidden>
    <button type="button" data-tab="s-home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/></svg>
      <span data-i18n="tabHome"></span>
    </button>
    <button type="button" data-tab="s-accounts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="13" rx="2"/><path d="M3.5 10h17"/><path d="M15 14.5h2.5"/></svg>
      <span data-i18n="tabAccounts"></span>
    </button>
    <button type="button" data-tab="s-debts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6"/></svg>
      <span data-i18n="tabDebts"></span>
    </button>
    <button type="button" data-tab="s-assets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-5 4 3 7-8"/><path d="M15 8h5v5"/></svg>
      <span data-i18n="tabAssets"></span>
    </button>
    <button type="button" data-tab="s-history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span data-i18n="tabHistory"></span>
    </button>
  </nav>
</main>
</body>
</html>
