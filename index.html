<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Règle de sécurité : l'app ne peut charger que son propre code.
       Aucun script, style, image ou connexion venant d'ailleurs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#800020">
  <title>Sika</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<main id="app">

  <!-- Chargement -->
  <section id="s-loading" class="screen">
    <p class="center muted" data-i18n="loading"></p>
    <p id="fatal" class="error center" role="alert"></p>
  </section>

  <!-- Bienvenue (aucun coffre sur ce téléphone) -->
  <section id="s-welcome" class="screen" hidden>
    <h1 data-i18n="appName"></h1>
    <p data-i18n="welcomeIntro"></p>
    <div class="row">
      <button type="button" class="chip" data-lang="fr">Français</button>
      <button type="button" class="chip" data-lang="en">English</button>
    </div>
    <button type="button" id="btn-go-create" class="primary" data-i18n="createVault"></button>
    <button type="button" id="btn-go-restore" class="secondary" data-i18n="restoreBackup"></button>
  </section>

  <!-- Création du coffre -->
  <section id="s-create" class="screen" hidden>
    <h1 data-i18n="createTitle"></h1>
    <p data-i18n="createRules"></p>
    <ul class="tips">
      <li data-i18n="createTip1"></li>
      <li data-i18n="createTip2"></li>
      <li data-i18n="createTip3"></li>
    </ul>
    <label><span data-i18n="passLabel"></span>
      <input id="create-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label><span data-i18n="passConfirmLabel"></span>
      <input id="create-pass2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label class="check"><input type="checkbox" class="show-pass" data-target="create-pass,create-pass2"> <span data-i18n="showPass"></span></label>
    <p id="create-err" class="error" role="alert"></p>
    <button type="button" id="btn-create" class="primary" data-i18n="createBtn"></button>
    <button type="button" class="link" data-back="s-welcome" data-i18n="back"></button>
  </section>

  <!-- Clé de secours : affichée une seule fois -->
  <section id="s-reckey" class="screen" hidden>
    <h1 data-i18n="recTitle"></h1>
    <p data-i18n="recIntro"></p>
    <ul class="tips">
      <li data-i18n="recTip1"></li>
      <li data-i18n="recTip2"></li>
      <li data-i18n="recTip3"></li>
    </ul>
    <div id="reckey-groups" class="reckey" aria-live="polite"></div>
    <label class="check"><input type="checkbox" id="reckey-ack"> <span data-i18n="recAck"></span></label>
    <label><span data-i18n="recVerifyLabel"></span>
      <input id="reckey-verify" type="password" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    </label>
    <label class="check"><input type="checkbox" class="show-pass" data-target="reckey-verify"> <span data-i18n="showPass"></span></label>
    <p id="reckey-err" class="error" role="alert"></p>
    <button type="button" id="btn-reckey-done" class="primary" data-i18n="recDone" disabled></button>
    <button type="button" id="btn-reckey-cancel" class="link" data-i18n="recCancel"></button>
  </section>

  <!-- Verrouillage -->
  <section id="s-lock" class="screen" hidden>
    <h1 data-i18n="appName"></h1>
    <p data-i18n="lockIntro"></p>
    <label><span data-i18n="passLabel"></span>
      <input id="lock-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label class="check"><input type="checkbox" class="show-pass" data-target="lock-pass"> <span data-i18n="showPass"></span></label>
    <p id="lock-msg" class="error" role="alert"></p>
    <button type="button" id="btn-unlock" class="primary" data-i18n="unlockBtn"></button>
    <button type="button" id="btn-go-recover" class="link" data-i18n="forgotPass"></button>
    <button type="button" id="btn-lock-restore" class="link" data-i18n="restoreBackup"></button>
  </section>

  <!-- Phrase oubliée : clé de secours -->
  <section id="s-recover" class="screen" hidden>
    <h1 data-i18n="recoverTitle"></h1>
    <p data-i18n="recoverIntro"></p>
    <label><span data-i18n="recKeyLabel"></span>
      <input id="recover-key" type="password" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    </label>
    <label><span data-i18n="newPassLabel"></span>
      <input id="recover-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label><span data-i18n="passConfirmLabel"></span>
      <input id="recover-pass2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label class="check"><input type="checkbox" class="show-pass" data-target="recover-key,recover-pass,recover-pass2"> <span data-i18n="showPass"></span></label>
    <p id="recover-err" class="error" role="alert"></p>
    <button type="button" id="btn-recover" class="primary" data-i18n="recoverBtn"></button>
    <button type="button" class="link" data-back="s-lock" data-i18n="back"></button>
  </section>

  <!-- Accueil (coffre ouvert) -->
  <section id="s-home" class="screen" hidden>
    <header class="bar">
      <h1 data-i18n="appName"></h1>
      <button type="button" id="btn-lock" class="secondary small" data-i18n="lockBtn"></button>
    </header>
    <div id="home-msg" class="banner warn" role="status"></div>
    <div id="home-backup-warn" class="banner warn" role="status" hidden></div>
    <div class="card">
      <h2 data-i18n="homeVaultTitle"></h2>
      <p data-i18n="homeVaultText"></p>
      <p class="muted" id="home-version"></p>
    </div>
    <div class="card">
      <h2 data-i18n="testNoteTitle"></h2>
      <p class="muted" data-i18n="testNoteHelp"></p>
      <textarea id="test-note" rows="4" maxlength="2000" autocomplete="off"></textarea>
      <button type="button" id="btn-save-note" class="primary" data-i18n="save"></button>
      <p id="note-msg" class="ok" role="status"></p>
    </div>
    <button type="button" id="btn-go-settings" class="secondary" data-i18n="settings"></button>
  </section>

  <!-- Réglages -->
  <section id="s-settings" class="screen" hidden>
    <header class="bar">
      <h1 data-i18n="settings"></h1>
      <button type="button" class="secondary small" data-back="s-home" data-i18n="back"></button>
    </header>

    <div class="card">
      <h2 data-i18n="backupTitle"></h2>
      <p id="set-last-backup" class="muted"></p>
      <p class="muted" data-i18n="backupHelp"></p>
      <button type="button" id="btn-export-dl" class="primary" data-i18n="exportDownload"></button>
      <button type="button" id="btn-export-share" class="secondary" data-i18n="exportShare" hidden></button>
      <button type="button" id="btn-go-import" class="secondary" data-i18n="importBtn"></button>
      <p id="export-msg" class="ok" role="status"></p>
    </div>

    <div class="card">
      <h2 data-i18n="changePassTitle"></h2>
      <label><span data-i18n="currentPassLabel"></span>
        <input id="cp-old" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label><span data-i18n="newPassLabel"></span>
        <input id="cp-new" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label><span data-i18n="passConfirmLabel"></span>
        <input id="cp-new2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label class="check"><input type="checkbox" class="show-pass" data-target="cp-old,cp-new,cp-new2"> <span data-i18n="showPass"></span></label>
      <p class="muted" data-i18n="changePassHelp"></p>
      <p id="cp-msg" class="error" role="alert"></p>
      <button type="button" id="btn-change-pass" class="secondary" data-i18n="changePassBtn"></button>
    </div>

    <div class="card">
      <h2 data-i18n="langTitle"></h2>
      <div class="row">
        <button type="button" class="chip" data-lang="fr">Français</button>
        <button type="button" class="chip" data-lang="en">English</button>
      </div>
      <h2 data-i18n="lockDelayTitle"></h2>
      <select id="lock-delay">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5">5 min</option>
      </select>
    </div>

    <div class="card">
      <h2 data-i18n="calTitle"></h2>
      <p class="muted" data-i18n="calHelp"></p>
      <button type="button" id="btn-ics" class="secondary" data-i18n="calIcs"></button>
      <a id="link-gcal" class="button secondary" target="_blank" rel="noopener noreferrer" data-i18n="calLink"></a>
    </div>

    <div class="card">
      <h2 data-i18n="storageTitle"></h2>
      <p id="storage-status" class="muted"></p>
    </div>

    <div class="card danger-zone">
      <h2 data-i18n="wipeTitle"></h2>
      <p class="muted" data-i18n="wipeHelp"></p>
      <button type="button" id="btn-wipe" class="danger" data-i18n="wipeBtn"></button>
    </div>
  </section>

  <!-- Importer une sauvegarde -->
  <section id="s-import" class="screen" hidden>
    <h1 data-i18n="importTitle"></h1>
    <p data-i18n="importIntro"></p>
    <label><span data-i18n="importFileLabel"></span>
      <input id="import-file" type="file">
    </label>
    <fieldset class="row">
      <label class="check"><input type="radio" name="import-mode" value="pass" checked> <span data-i18n="importModePass"></span></label>
      <label class="check"><input type="radio" name="import-mode" value="rec"> <span data-i18n="importModeRec"></span></label>
    </fieldset>
    <label><span id="import-secret-label" data-i18n="passLabel"></span>
      <input id="import-secret" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <label class="check"><input type="checkbox" class="show-pass" data-target="import-secret,import-pass,import-pass2"> <span data-i18n="showPass"></span></label>
    <div id="import-newpass" hidden>
      <p class="muted" data-i18n="importNewPassHelp"></p>
      <label><span data-i18n="newPassLabel"></span>
        <input id="import-pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label><span data-i18n="passConfirmLabel"></span>
        <input id="import-pass2" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
    </div>
    <p id="import-msg" class="error" role="alert"></p>
    <button type="button" id="btn-import" class="primary" data-i18n="importCheckBtn"></button>
    <button type="button" id="btn-import-back" class="link" data-i18n="back"></button>
  </section>

  <!-- Fenêtre de confirmation -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <input id="modal-input" type="text" autocomplete="off" autocapitalize="characters" hidden>
      <div class="row">
        <button type="button" id="modal-cancel" class="secondary" data-i18n="cancel"></button>
        <button type="button" id="modal-ok" class="danger" data-i18n="confirm"></button>
      </div>
    </div>
  </div>

  <div id="busy" class="busy" hidden><p data-i18n="working"></p></div>
</main>
</body>
</html>
